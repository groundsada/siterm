---
# Conversational Claude on issues and PRs, answering to "@claude".
#
# Runs against NRP's Anthropic-compatible gateway (ellm.nrp-nautilus.io), not
# api.anthropic.com, so it costs nothing: NRP's models are free and this fork is
# public, where Actions minutes are unmetered. Same trade as "dev fe image" —
# the work sits here rather than in the private internal-sense-stack.
#
# Fork-only, like the other dev-* workflows: this file is not upstream in
# sdn-sense/siterm. Keep it out of branches that get PR'd there.
name: claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

# One Claude per thread. Never cancel mid-run: a cancelled run leaves its
# progress comment stranded with unchecked boxes and no result.
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # The action re-checks the trigger phrase itself, but that happens after a
    # runner is already up. Filtering here keeps unrelated comment traffic from
    # showing as a run at all.
    if: |
      contains(github.event.comment.body, '@claude') ||
      contains(github.event.review.body, '@claude') ||
      contains(github.event.issue.body, '@claude') ||
      contains(github.event.issue.title, '@claude')
    runs-on: ubuntu-latest
    permissions:
      # Read-only on code on purpose. Claude reviews and comments; it does not
      # push. The NRP token is a shared credential and this repo is public, so
      # the blast radius of a prompt injection is kept to "posts a bad comment".
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Reviews need to diff against the base, which a depth-1 clone cannot
          # do. Also drop the checkout token so it is not left in .git/config
          # for the model's Bash calls to find.
          fetch-depth: 0
          persist-credentials: false

      - uses: anthropics/claude-code-action@v1
        with:
          # NRP accepts this as a bearer token (verified: x-api-key, Authorization
          # and both together all return 200). No ANTHROPIC_API_KEY is involved
          # and nothing here bills Anthropic.
          anthropic_api_key: ${{ secrets.NRP_AUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # No use_sticky_comment: verified a no-op here. It finds the comment to
          # update by looking for claude[bot], but authenticating with
          # GITHUB_TOKEN posts as github-actions[bot], so every run appends a new
          # comment regardless. Setting it would just imply behaviour we do not get.

          # Read, reason, comment. No Edit/Write/push.
          claude_args: |
            --model glm-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(git log:*),Bash(git diff:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"

          # Claude Code spawns the CLI as a subprocess, and settings.env wins over
          # plain process env, so the endpoint has to be declared in both places
          # to survive. Mirrored in the step env below.
          settings: |
            {
              "env": {
                "ANTHROPIC_BASE_URL": "https://ellm.nrp-nautilus.io/anthropic",
                "ANTHROPIC_AUTH_TOKEN": "${{ secrets.NRP_AUTH_TOKEN }}",
                "ANTHROPIC_DEFAULT_HAIKU_MODEL": "deepseek-v4-flash",
                "ANTHROPIC_DEFAULT_SONNET_MODEL": "glm-5",
                "ANTHROPIC_DEFAULT_OPUS_MODEL": "glm-5",
                "CLAUDE_CODE_SUBAGENT_MODEL": "deepseek-v4-flash",
                "CLAUDE_CODE_AUTO_COMPACT_WINDOW": "200000",
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "16000",
                "API_TIMEOUT_MS": "600000",
                "CLAUDE_STREAM_IDLE_TIMEOUT_MS": "3000000",
                "ENABLE_TOOL_SEARCH": "false",
                "DISABLE_TELEMETRY": "1",
                "DISABLE_NON_ESSENTIAL_MODEL_CALLS": "1",
                "CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS": "1"
              }
            }
        env:
          ANTHROPIC_BASE_URL: https://ellm.nrp-nautilus.io/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.NRP_AUTH_TOKEN }}
          # NRP serves only its own model names on the Anthropic path. Claude Code
          # resolves subagents and background tasks through these role variables,
          # so leaving them at claude-haiku-4-5 / claude-sonnet-5 / claude-opus-5
          # makes every one of those calls 404 and the run die partway through.
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          ANTHROPIC_DEFAULT_SONNET_MODEL: glm-5
          ANTHROPIC_DEFAULT_OPUS_MODEL: glm-5
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
          # glm-5 holds 300K; 200000 leaves room before the gateway 400s on
          # context overflow. It also spends output tokens on reasoning before
          # emitting any text, hence the unusually high output cap.
          CLAUDE_CODE_AUTO_COMPACT_WINDOW: "200000"
          CLAUDE_CODE_MAX_OUTPUT_TOKENS: "16000"
          API_TIMEOUT_MS: "600000"
          CLAUDE_STREAM_IDLE_TIMEOUT_MS: "3000000"
          # NRP's open-weights models cannot reliably emit the tool-search tool.
          ENABLE_TOOL_SEARCH: "false"
          DISABLE_TELEMETRY: "1"
          DISABLE_NON_ESSENTIAL_MODEL_CALLS: "1"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
