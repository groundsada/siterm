---
# Builds a SiteRM FE image from whatever was just pushed and hands the tag to
# the sense-dev deploy workflow in groundsada/internal-sense-stack.
#
# This lives in the public fork on purpose: the FE build takes ~10 min and
# Actions minutes are free here, while internal-sense-stack is private and bills
# against the monthly quota. That repo only runs the ~30s apply.
name: dev fe image

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit SHA, branch or tag to build"
        required: false
        default: ""

concurrency:
  group: dev-fe-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/groundsada/siterm-fe
  # Base image tag, and the argument pre-install.sh reads. "dev" makes it stamp
  # a -dev version suffix; "latest" leaves the version alone.
  RELEASE: latest
  # Branch of the sense-*-collection ansible repos.
  GITBRANS: master

# Declared explicitly rather than left to the repository default, which grants
# write-all. Job-level permissions can only narrow this, so it lists exactly what
# the build needs and nothing more.
permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Context values go through env rather than being interpolated into the
      # script body: a ${{ }} expansion inside run: is substituted before the
      # shell sees it, so anything caller-controlled is a shell injection.
      - name: Resolve ref and tags
        id: vars
        env:
          INPUT_REF: ${{ github.event.inputs.ref }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          REF="$INPUT_REF"
          if [ -z "$REF" ]; then
            REF="$HEAD_SHA"
            BRANCH="$REF_NAME"
          else
            BRANCH="$REF"
          fi
          # Branch names may contain / and other characters a tag cannot hold.
          SLUG=$(echo "$BRANCH" | tr -c 'a-zA-Z0-9_.-' '-' | sed 's/-*$//' | cut -c1-100)
          {
            echo "ref=$REF"
            echo "slug=$SLUG"
            echo "sha=${REF:0:12}"
          } >> "$GITHUB_OUTPUT"

      # Only the build context is needed. The Dockerfile clones siterm itself
      # from GitHub at build time, so this repo is never checked out.
      - name: Checkout siterm-startup
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: groundsada/siterm-startup
          ref: master
          path: siterm-startup
          # Do not leave the token in .git/config afterwards.
          persist-credentials: false

      - name: Set up buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FE image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: siterm-startup/fe/container-build-files
          file: siterm-startup/fe/container-build-files/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.slug }}
          build-args: |
            RELEASE=${{ env.RELEASE }}
            GITORG=groundsada
            GITREPO=siterm
            GITBR=${{ steps.vars.outputs.ref }}
            GITBRANS=${{ env.GITBRANS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger sense-dev deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAG: ${{ steps.vars.outputs.sha }}
          SLUG: ${{ steps.vars.outputs.slug }}
          REF: ${{ steps.vars.outputs.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DEPLOY_DISPATCH_TOKEN not set, skipping deploy trigger"
            echo "Image is pushed: ${IMAGE}:${TAG}"
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg branch "$SLUG" --arg ref "$REF" \
            '{event_type:"siterm-image", client_payload:{tag:$tag, branch:$branch, ref:$ref}}' \
            | gh api repos/groundsada/internal-sense-stack/dispatches --input -
          echo "Dispatched deploy for ${IMAGE}:${TAG}"

      - name: Summary
        env:
          SHA_TAG: ${{ steps.vars.outputs.sha }}
          SLUG_TAG: ${{ steps.vars.outputs.slug }}
          BUILT_REF: ${{ steps.vars.outputs.ref }}
        run: |
          {
            echo "### FE image"
            echo ""
            echo '```'
            echo "${IMAGE}:${SHA_TAG}"
            echo "${IMAGE}:${SLUG_TAG}"
            echo '```'
            echo ""
            echo "built from \`${BUILT_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
