---
# Builds a SiteRM FE image from whatever was just pushed and hands the tag to
# the sense-dev deploy workflow in groundsada/internal-sense-stack.
#
# This lives in the public fork on purpose: the FE build takes ~10 min and
# Actions minutes are free here, while internal-sense-stack is private and bills
# against the monthly quota. That repo only runs the ~30s apply.
name: dev fe image

on:
  push:
    branches: ['**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch or tag to build'
        required: false
        default: ''

concurrency:
  group: dev-fe-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/groundsada/siterm-fe
  # Base image tag, and the argument pre-install.sh reads. "dev" makes it stamp
  # a -dev version suffix; "latest" leaves the version alone.
  RELEASE: latest
  # Branch of the sense-*-collection ansible repos.
  GITBRANS: master

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve ref and tags
        id: vars
        run: |
          REF="${{ github.event.inputs.ref }}"
          if [ -z "$REF" ]; then
            REF="${{ github.sha }}"
            BRANCH="${{ github.ref_name }}"
          else
            BRANCH="$REF"
          fi
          # Branch names may contain / and other characters a tag cannot hold.
          SLUG=$(echo "$BRANCH" | tr -c 'a-zA-Z0-9_.-' '-' | sed 's/-*$//' | cut -c1-100)
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "sha=${REF:0:12}" >> "$GITHUB_OUTPUT"

      # Only the build context is needed. The Dockerfile clones siterm itself
      # from GitHub at build time, so this repo is never checked out.
      - name: Checkout siterm-startup
        uses: actions/checkout@v4
        with:
          repository: groundsada/siterm-startup
          ref: master
          path: siterm-startup

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push FE image
        uses: docker/build-push-action@v6
        with:
          context: siterm-startup/fe/container-build-files
          file: siterm-startup/fe/container-build-files/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.sha }}
            ${{ env.IMAGE }}:${{ steps.vars.outputs.slug }}
          build-args: |
            RELEASE=${{ env.RELEASE }}
            GITORG=groundsada
            GITREPO=siterm
            GITBR=${{ steps.vars.outputs.ref }}
            GITBRANS=${{ env.GITBRANS }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger sense-dev deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_DISPATCH_TOKEN }}
          TAG: ${{ steps.vars.outputs.sha }}
          SLUG: ${{ steps.vars.outputs.slug }}
          REF: ${{ steps.vars.outputs.ref }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::DEPLOY_DISPATCH_TOKEN not set, skipping deploy trigger"
            echo "Image is pushed: ${IMAGE}:${TAG}"
            exit 0
          fi
          jq -n --arg tag "$TAG" --arg branch "$SLUG" --arg ref "$REF" \
            '{event_type:"siterm-image", client_payload:{tag:$tag, branch:$branch, ref:$ref}}' \
            | gh api repos/groundsada/internal-sense-stack/dispatches --input -
          echo "Dispatched deploy for ${IMAGE}:${TAG}"

      - name: Summary
        run: |
          {
            echo "### FE image"
            echo ""
            echo '```'
            echo "${IMAGE}:${{ steps.vars.outputs.sha }}"
            echo "${IMAGE}:${{ steps.vars.outputs.slug }}"
            echo '```'
            echo ""
            echo "built from \`${{ steps.vars.outputs.ref }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
