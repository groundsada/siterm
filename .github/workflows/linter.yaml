---
name: Linter

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions:
  contents: read
  packages: read
  statuses: write

jobs:
  linter:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Full history so super-linter can diff against the default branch.
          fetch-depth: 0
          # Do not leave the token in .git/config afterwards. Super-linter reads
          # the working tree, so it never needs the credential.
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter/slim@4ce20838b8ab83717e78138c5b3a1407148e0918 # v8.7.0
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: false
          VALIDATE_PYTHON_BLACK: false
          VALIDATE_PYTHON_FLAKE8: false
          VALIDATE_PYTHON_MYPY: false
          VALIDATE_PYTHON_ISORT: false
          VALIDATE_PYTHON_PYINK: false
          VALIDATE_JSCPD: false
          # src/html/assets is vendored frontend code -- bootstrap, next.js,
          # multiselect -- plus page scripts that have never been held to
          # biome's formatting. Biome reports 20 files there and nothing else in
          # the tree, so it only ever fails the run on code nobody is changing.
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_BIOME_LINT: false
          # To report GitHub Actions status checks
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
